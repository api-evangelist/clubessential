name: Clubessential
description: Clubessential is a Cincinnati-based provider of club management software
  for private country, golf, city, athletic, and yacht clubs. Its cloud suite unifies
  club websites and mobile apps, tee-time and dining reservations, membership CRM,
  point-of-sale, accounting, business intelligence, and integrated payments so club
  staff can manage operations and member experiences from a single platform. Part
  of Clubessential Holdings (unified under Xplor Technologies alongside ClubReady,
  foreUP, Vermont Systems, PrestoSports, and Exerp), the company serves more than
  1,300 private clubs and, with its sister brands, thousands of courses and clubs
  worldwide. Backed by Battery Ventures.
